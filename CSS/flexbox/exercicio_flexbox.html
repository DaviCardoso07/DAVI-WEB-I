<!DOCTYPE html>
<html>
    <head>
        <title>Exercíco FLEXBOX</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <h1>FLEXBOX</h1>

        <section id="direction">
            <h3>flex-direction</h3>
            <div class="box">Caixa 1</div>
            <div class="box">Caixa 2</div>
            <div class="box">Caixa 3</div>
        </section>

         <section id="justify">
            <h3>justify-content</h3>
            <div class="box">Caixa 1</div>
            <div class="box">Caixa 2</div>
            <div class="box">Caixa 3</div>
        </section>

        <section id="align-items">
            <h3>align-items</h3>
            <div class="box">Caixa 1</div>
            <div class="box">Caixa 2</div>
            <div class="box">Caixa 3</div>
        </section>

        <section id="wrap">
            <h3>flex-wrap</h3>
            <div class="box">Caixa 1</div>
            <div class="box">Caixa 2</div>
            <div class="box">Caixa 3</div>
            <div class="box">Caixa 4</div>
            <div class="box">Caixa 5</div>
            <div class="box">Caixa 6</div>
        </section>
    </body>
</html>
