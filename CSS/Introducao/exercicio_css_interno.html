<!DOCTYPE html>
<html>
<head>
    <title>Exercício css interno</title>
    <style>
        #titulo {color: cyan;background-color: goldenrod;}
        #inicio {color: black; background-color: green;}
        #meio {color: brown; background-color: aqua;}
        #fim {color: aquamarine; background-color: darkslateblue;}
        #titulo2 {color: cadetblue; background-color: darkolivegreen;}
        .fmce {color: chartreuse; background-color: blue;}
    </style>
</head>
<body>
    <h1 id="titulo">Alguma coisa</h1>
    <p id="inicio">Olá</p>
    <p id="meio">Mundo</p>
    <p id="fim">Estou Vivo</p>
    <h2 id="titulo2">Sei lá</h2>
    <p class="fmce">Fortaleza é melhor</p>
    <p class="fmce">Que o Ceará</p>
</body>
</html>
