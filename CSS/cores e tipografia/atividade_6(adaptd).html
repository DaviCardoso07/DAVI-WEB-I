<!DOCTYPE html>
<html>
    <head>
        <title>Atividade 6</title>
        <style>
            p {background-color: gray; font-size: 20px; line-height: 1.8;}
            ol {color: #1b4f72;background-color: #fffacd; font-size: 18px; font-weight: bold; letter-spacing: 2px; line-height: 1.8;}
            body {font-family: Verdana, sans-serif;}
        </style>
    </head>
    <body>
        <p>Lista ordenada:</p>
        <ol type="1">
            <li>Item 1</li>
            <li>Item 2</li>
        </ol>
        <ol type="a" start="3">
            <li>Item 1</li>
            <li>Item 2</li>
        </ol>
        <ol type="A" start="5">
            <li>Item 1</li>
            <li>Item 2</li>
        </ol>
        <ol type="i" reversed>
            <li>Item 1</li>
            <li>Item 2</li>
        </ol>
        <ol type="I" reversed>
            <li>Item 1</li>
            <li>Item 2</li>
        </ol>

    </body>
</html>
